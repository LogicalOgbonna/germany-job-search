services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobdesk
      POSTGRES_PASSWORD: local-jobdesk
      POSTGRES_DB: jobdesk
    ports:
      - "127.0.0.1:${JOBDESK_DB_PORT:-55011}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobdesk"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${JOBDESK_REDIS_PORT:-55012}:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres:
  redis:
